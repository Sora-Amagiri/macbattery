name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Check tag matches Cargo.toml version
        run: |
          version="$(awk -F'"' '/^version = /{ print $2; exit }' Cargo.toml)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match Cargo.toml v$version" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Build (Apple Silicon)
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Build (Intel)
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Package universal binary
        run: |
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/macbattery \
            target/x86_64-apple-darwin/release/macbattery \
            -output dist/macbattery
          # lipo invalidates the per-arch signatures, so re-sign ad-hoc.
          codesign --force --sign - dist/macbattery
          tar -czf dist/macbattery-macos-universal.tar.gz -C dist macbattery
          (cd dist && shasum -a 256 macbattery-macos-universal.tar.gz > checksums.txt)
          cat dist/checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/macbattery-macos-universal.tar.gz \
            dist/checksums.txt \
            --title "macbattery $GITHUB_REF_NAME" \
            --generate-notes
