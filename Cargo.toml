[package]
name = "macbattery"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Live MacBook battery health dashboard for the terminal"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Sora-Amagiri/macbattery"
keywords = ["battery", "macos", "tui", "iokit", "cli"]
categories = ["command-line-utilities", "hardware-support"]

[[bin]]
name = "macbattery"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"

[profile.release]
lto = true
strip = true
